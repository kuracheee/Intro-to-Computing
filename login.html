<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f5f9;
			color: #172033;
			font: 16px/1.5 system-ui, sans-serif;
		}
		.card {
			width: min(100%, 400px);
			padding: 36px;
			background: white;
			border: 1px solid #e1e6ef;
			border-radius: 14px;
			box-shadow: 0 12px 32px rgb(23 32 51 / 8%);
		}
		h1 { margin: 0 0 6px; font-size: 1.8rem; }
		.intro { margin: 0 0 24px; color: #657087; }
		.field { margin-bottom: 18px; }
		label { display: block; margin-bottom: 7px; font-weight: 600; }
		input[type="email"], input[type="password"] {
			width: 100%;
			padding: 11px 12px;
			border: 1px solid #cbd2df;
			border-radius: 7px;
			font: inherit;
		}
		input:focus { outline: 3px solid #dce5ff; border-color: #315ed0; }
		.options { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 2px 0 22px; font-size: .9rem; }
		.remember { display: flex; align-items: center; gap: 7px; font-weight: 400; }
		a { color: #315ed0; text-decoration: none; }
		a:hover { text-decoration: underline; }
		button {
			width: 100%;
			padding: 12px;
			border: 0;
			border-radius: 7px;
			background: #315ed0;
			color: white;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: #244caf; }
		.signup { margin: 20px 0 0; text-align: center; color: #657087; font-size: .92rem; }
		@media (max-width: 440px) { .card { padding: 28px 22px; } }
	</style>
</head>
<body>
	<main class="card">
		<h1>Welcome back</h1>
		<p class="intro">Sign in to your account to continue.</p>
		<form action="#" method="post">
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
			</div>
			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#">Forgot password?</a>
			</div>
			<button type="submit">Sign in</button>
		</form>
		<p class="signup">Don't have an account? <a href="#">Create one</a></p>
	</main>
</body>
</html>
